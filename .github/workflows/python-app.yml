name: AnimeRenamer CI & Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9,<10" "flake8>=7,<8"
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Check critical Python errors
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: xvfb-run -a python -m pytest -q

  build:
    name: Build Windows EXE
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6,<7"
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

      - name: Build versioned Windows EXE
        shell: pwsh
        run: |
          $buildNo = [int]"${{ github.run_number }}"

          python tools/generate_version_info.py `
            --output build/windows_version_info.txt `
            --build $buildNo

          $exeBase = (python -c "from tools.generate_version_info import exe_basename; print(exe_basename($buildNo))").Trim()
          if (-not $exeBase) {
            throw "Failed to resolve versioned EXE name"
          }
          $exeName = "$exeBase.exe"

          "ANIMERENAMER_BUILD_NUMBER=$buildNo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANIMERENAMER_EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx `
            --name "$exeBase" `
            --paths "$PWD\ui" `
            --version-file "$PWD\build\windows_version_info.txt" `
            --icon "$PWD\assets\app_icon.ico" `
            --add-data "$PWD\assets;assets" `
            --distpath "$PWD\dist" `
            AnimeRenamer.pyw

          if (-not (Test-Path "dist\$exeName")) {
            throw "PyInstaller completed without producing dist\$exeName"
          }

      - name: Create release ZIP
        run: python tools/package_release.py

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            Get-Item "dist\$env:ANIMERENAMER_EXE_NAME"
            Get-ChildItem "dist\AnimeRenamer_v*.zip" -File
          )
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AnimeRenamer-Windows-${{ github.run_number }}
          path: |
            dist/AnimeRenamer_FutureDiary_v*.exe
            dist/AnimeRenamer_v*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
